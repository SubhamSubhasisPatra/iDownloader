name: iDownloader
options:
  bundleIdPrefix: io.github.subhamsubhasispatra
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTorrent:
    path: Vendor/SwiftTorrent
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "5.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
targets:
  iDownloader:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: SwiftTorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.subhamsubhasispatra.idownloader
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iDownloader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Subham Subhasis Patra. Licensed under the GNU GPL v3."
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: Magnet link
            CFBundleURLSchemes:
              - magnet
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent Metainfo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.bittorrent.torrent
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent Metainfo
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
